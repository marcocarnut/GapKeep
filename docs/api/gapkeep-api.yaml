# GapKeep's JavaScript API: the single description of it.
#
# tools/gen_api.py generates from this file:
#   docs/API.md                    the reference (humans and agents)
#   sim/web/types/gapkeep.d.ts     TypeScript declarations (editor completions)
# tools/check_api.py compares it with the API the runtime really has (an
# introspection app run on the simulator), so the two cannot drift apart.
#
# Edit this file, then run: python3 tools/gen_api.py
#
# Conventions: `md` fields are Markdown. `ts` fields are TypeScript types
# or signatures, as they go into gapkeep.d.ts. A property is `readable` if
# reading it returns its current value; others are write-only (they can only
# be set), except `readonly` ones, which can only be read.

title: GapKeep JavaScript API reference

intro: |
  Apps are ES modules running on QuickJS. They reach the system through the
  modules below, imported by name:

  | Module | Available to | Purpose |
  | --- | --- | --- |
  | [`gk:ui`](#gkui) | every app | Widgets, layout, input, alerts |
  | [`gk:sys`](#gksys) | every app | App info, versions, uptime, memory, exit |
  | [`gk:crypto`](#gkcrypto) | every app | Hashes, HMAC, PBKDF2, secp256k1 (ECDSA, Schnorr, BIP-32 and Taproot tweaks), OpenPGP's Ed25519, RSA signatures, AES-CFB and S2K, hardware random bytes |
  | [`gk:clock`](#gkclock) | every app (setting it: `"rtc"`) | The wall clock, alarms on its marks |
  | [`gk:session`](#gksession) | every app | Values kept across the app's runs, in RAM, until power-off |
  | [`gk:i18n`](#gki18n) | every app (changing the settings: `"settings"`) | Translations, numbers, amounts and dates in the person's language |
  | [`gk:data`](#gkdata) | every app (only the folders its manifest lists in `"data"`) | Read-only files from the card's data folders, shared by name |
  | [`gk:usb`](#gkusb) | apps that list devices in `"usb"` (only those) | Control transfers to USB devices claimed for them |
  | [`gk:apps`](#gkapps) | apps with the `"apps"` permission | List and launch apps (the launcher) |

  Plus the [globals](#globals) `console`, `setTimeout`, `setInterval`,
  `clearTimeout` and `clearInterval`, and the standard JavaScript library
  (ES2023).

  An app's own modules are imported with relative paths (`"./lib/x.js"`).
  Paths are resolved inside the app's directory; `..` cannot leave it.

# --- gk:ui ----------------------------------------------------------------------

ui:
  import: 'import * as ui from "gk:ui";'

  types:
    - name: Size
      ts: number | string
      md: |
        A **size** is a number of pixels, a percentage of the parent as a string
        (`"50%"`), or `"content"` (fit the children).
    - name: Color
      ts: number | string
      md: 'A **color** is `0xRRGGBB`, `"#RRGGBB"` or `"#RGB"`.'
    - name: Detector
      ts: '"qr" | "qr-color"'
      md: 'A **detector** is something a `Scanner` can recognise: `"qr"` for QR codes; `"qr-color"`, experimental, for the data a colour QR code carries in its colours ([EXPERIMENTAL.md](EXPERIMENTAL.md)).'
    - name: ImageSource
      ts: '{ width: number; height: number; data: Uint8Array | ArrayBuffer }'
      md: |
        An **image source** is `{ width, height, data }`: `data` holds
        `width * height * 4` bytes of RGBA (straight alpha, rows top to bottom),
        as canvas `ImageData`.

  exports:
    - name: Widget
      kind: class
      md: Base class of all widgets. Not constructible; use for `instanceof`.
    - name: widgets
      kind: classes
      md: '[Widgets](#widgets)'
    - name: screen
      ts: Container
      md: The app's root widget. A column with 16 px padding and 12 px gap.
    - name: width
      ts: number
      md: Display size in pixels.
      also: height
    - name: height
      ts: number
      hidden_in_table: true
    - name: fonts
      ts: number[]
      md: >-
        Available font sizes: 12, 14, 16, 18, 20, 22, 24, 28, 32, 40. Every size
        has Montserrat's Basic Latin, Latin-1 and Latin Extended-A letters, the
        dashes, quotes, bullet and ellipsis (– — ‘ ’ “ ” • …), € and ₿, and the
        `ui.symbols` icons. Other characters are drawn as an empty box.
    - name: monoFonts
      ts: number[]
      md: >-
        Sizes of the monospaced font (`mono: true`): 12, 14, 16, 18, 20, 24, 28. Basic
        Latin and Latin-1 in JetBrains Mono; other characters (icons, Latin
        Extended-A, € and ₿) from the normal font of the same size.
    - name: symbols
      kind: object
      ts: SymbolTable
      md: 'Icon glyphs usable in any text, e.g. `ui.symbols.ok`. [List](#symbols).'
    - name: alert
      ts: '(message: string, options?: { title?: string; buttons?: string[] }) => Promise<number>'
      signature: alert(message, options?)
      md: Modal message. [Details](#uialert).
    - name: onKey
      ts: '(handler: ((ev: KeyEvent) => boolean | void) | null) => void'
      signature: onKey(handler)
      md: App-wide key handler. [Details](#uionkey).
    - name: theme
      ts: '(options: { dark?: boolean; primary?: Color; secondary?: Color }) => void'
      signature: theme(options)
      md: Change colors. [Details](#uitheme).
    - name: escapeMarkup
      ts: '(text: string) => string'
      signature: escapeMarkup(text)
      md: 'The text, for a Label with `markup: true`, shown as it is: `&`, `<`, `>`, `"` and `''` as entities. Use it for anything not written by the app (a name, an address, a scanned code), or use `gk:i18n`''s `tm()`.'

  creating: |
    ```js
    new ui.Label(props?)            // child of ui.screen
    new ui.Label(parent, props?)    // child of another widget
    ```

    `props` is an object of [properties](#common-properties) and
    [event handlers](#events). Unknown property names and invalid values throw a
    `TypeError` naming the problem, both here and in `set()`, so typos don't
    fail silently.

    Widgets can be subclassed:

    ```js
    class Title extends ui.Label {
      constructor(parent, text) {
        super(parent, { text, font: 28 });
      }
    }
    ```

  base_members:
    - name: set
      signature: set(props)
      ts: '(props: P) => this'
      md: Apply several properties. Returns the widget (chainable).
    - name: 'on'
      signature: on(event, fn)
      ts: '(event: EventName, handler: (this: this, ev: WidgetEvent) => void) => this'
      md: Set the handler for an event (replaces any previous one). Chainable.
    - name: 'off'
      signature: off(event)
      ts: '(event: EventName) => this'
      md: Remove the handler. Chainable.
    - name: focus
      signature: focus()
      ts: '() => void'
      md: Give keyboard focus to the widget (if it is focusable).
    - name: delete
      signature: delete()
      ts: '() => void'
      md: Remove the widget and its children. Safe inside the widget's own handlers. Calling it twice is harmless.
    - name: clear
      signature: clear()
      ts: '() => this'
      md: Delete all children. Chainable.
    - name: scrollIntoView
      signature: scrollIntoView()
      ts: '() => void'
      md: Scroll the parents so the widget is visible.
    - name: parent
      ts: Widget | null
      readonly: true
      md: Parent widget (read-only), `null` for the screen.
    - name: children
      ts: Widget[]
      readonly: true
      md: Array of child widgets (read-only, a new array each time).
    - name: alive
      ts: boolean
      readonly: true
      md: '`false` once deleted (read-only). Any other use of a deleted widget throws.'
    - name: type
      ts: string
      readonly: true
      md: '`"Label"`, `"Button"`, ... (read-only).'

  base_members_after: |
    Every property in the tables below is also a JavaScript property:
    `label.text = "hi"` is the same as `label.set({ text: "hi" })`. Properties
    marked *readable* return their current value; the others are write-only.

  common_props:
    - group: Geometry and layout
      props:
        - {name: x, also: y, ts: Size, value: size, md: Position. Relative to the `align` point if set.}
        - {name: 'y', ts: Size, hidden_in_table: true}
        - {name: width, also: height, ts: Size, value: size, readable: true, md: '*Readable* (returns pixels).'}
        - {name: height, ts: Size, readable: true, hidden_in_table: true}
        - {name: minWidth, also: [maxWidth, minHeight, maxHeight], ts: Size, value: size, md: ''}
        - {name: maxWidth, ts: Size, hidden_in_table: true}
        - {name: minHeight, ts: Size, hidden_in_table: true}
        - {name: maxHeight, ts: Size, hidden_in_table: true}
        - {name: grow, ts: number, value: number, md: Flex grow factor inside a row/column parent.}
        - name: align
          ts: '"default" | "center" | "top-left" | "top-mid" | "top-right" | "bottom-left" | "bottom-mid" | "bottom-right" | "left-mid" | "right-mid"'
          md: Position within the parent. Ignored when the parent has a layout.
        - name: layout
          ts: '"none" | "row" | "column" | "row-wrap" | "column-wrap"'
          md: How children are arranged.
        - name: justify
          ts: '"start" | "center" | "end" | "space-between" | "space-around" | "space-evenly"'
          md: Main-axis placement of children.
        - name: alignItems
          ts: '"start" | "center" | "end"'
          md: Cross-axis placement of children.
        - {name: gap, ts: number, value: number, md: 'Space between children, px.'}
        - name: padding
          ts: number | [number, number] | [number, number, number, number]
          value: number, `[v, h]` or `[top, right, bottom, left]`
          md: Inner spacing, px.
      after_md: |
        A **size** is a number of pixels, a percentage of the parent as a string
        (`"50%"`), or `"content"` (fit the children).
    - group: Appearance
      props:
        - {name: bg, ts: Color, value: color, md: Background color (makes the background opaque).}
        - {name: color, ts: Color, value: color, md: Text color.}
        - {name: font, ts: number, value: number, md: 'Font size, one of `ui.fonts`.'}
        - name: mono
          ts: boolean
          readable: true
          md: >-
            *Readable*. The monospaced font (JetBrains Mono), for addresses, keys,
            hex and code: 0/O and 1/l/I differ. Its sizes are `ui.monoFonts`; with
            `font` too, in any order, that size must be one of them, without it the
            size the widget would have (or the next smaller mono size). Same line
            height and baseline as the normal font of the same size, so the two mix
            on a row. Set on a container, its children inherit it.
        - {name: textAlign, ts: '"left" | "center" | "right"', md: ''}
        - {name: radius, ts: number, value: number, md: 'Corner radius, px.'}
        - {name: borderWidth, ts: number, value: number, md: px.}
        - {name: borderColor, ts: Color, value: color, md: ''}
        - {name: opacity, ts: number, value: number 0..1, md: 'Whole widget, including children.'}
      after_md: 'A **color** is `0xRRGGBB`, `"#RRGGBB"` or `"#RGB"`.'
    - group: State
      props:
        - {name: hidden, ts: boolean, readable: true, md: '*Readable*. Hidden widgets take no space in layouts.'}
        - {name: disabled, ts: boolean, readable: true, md: '*Readable*. Grayed out, ignores input.'}
        - name: scrollable
          ts: boolean
          md: 'Whether content overflowing the widget can be scrolled. Panels and the screen scroll by default, Containers only when set ([Container](#container)).'
        - {name: clickable, ts: boolean, md: Whether the widget receives clicks.}
        - name: focusable
          ts: boolean
          readable: true
          md: '*Readable*. Whether Tab stops at the widget. Buttons, text areas and other input widgets are focusable already; set it on a Container to make it a keyboard target (it gets the focus ring and is scrolled into view when focused).'

  events:
    - {name: click, prop: onClick, md: 'Clicked, or Enter/Space while focused.'}
    - {name: change, prop: onChange, md: The value changed (by the person or by code).}
    - {name: submit, prop: onSubmit, md: Enter in a one-line TextArea.}
    - {name: focus, prop: onFocus, md: Received keyboard focus.}
    - {name: blur, prop: onBlur, md: Lost keyboard focus.}
    - {name: longpress, prop: onLongPress, md: Pressed and held.}
    - {name: key, prop: onKey, md: 'A key reached the focused widget (after `ui.onKey`).'}
    - {name: press, prop: onPress, md: 'The mouse button went down on the widget, or Enter/Space while it is focused.'}
    - {name: drag, prop: onDrag, md: The mouse moved while pressed on the widget (only when it actually moved).}
    - {name: release, prop: onRelease, md: The press ended.}

  event_intro: |
    Handlers receive one event object and are called with `this` set to the
    widget:

  event_fields:
    - {name: type, ts: EventName, md: Event name.}
    - {name: target, ts: Widget, md: The widget.}
    - {name: value, ts: any, md: 'For value-carrying widgets: TextArea text, Checkbox/Switch `checked`, Slider/Bar `value`, Dropdown `selected`, TabView `active`.'}
    - {name: key, ts: string, optional: true, md: '`"key"` events only: key name (see [key names](#key-names)).'}
    - {name: pointer, ts: boolean, optional: true, md: '`"press"`, `"drag"`, `"release"`: `true` if from the mouse, `false` if from the keyboard.'}
    - {name: x, also: 'y', ts: number, optional: true, md: "Same events, mouse only: position relative to the widget's top-left corner, px."}
    - {name: 'y', ts: number, optional: true, hidden_in_table: true}
    - {name: time, ts: number, optional: true, md: 'Same events: uptime in milliseconds, microsecond resolution (as `sys.uptime()`).'}

  events_after: |
    A widget with a `"drag"` handler does not scroll its parents when dragged
    on, so drawing or entropy-collecting areas work inside scrollable pages.
    Holding Enter or Space does not repeat `"click"` or `"press"`: auto-repeat
    moves and types, but never activates.

  widgets:
    - name: Container
      md: |
        An invisible box for layout: no background, border or padding, sized to its
        content by default. Children's focus rings may draw outside it.

        A Container doesn't scroll unless you set `scrollable: true`. A scrollable
        Container clips its content (rows scrolled out of view must not draw over
        the rest of the screen) and, unless you set `padding`, gets 5 px of padding
        so the focus rings of the widgets at its edges stay whole. If you set your own
        padding on a scrollable Container, leave at least 5 px for the ring: it is
        3 px wide, 2 px away from the widget.

    - name: Panel
      md: |
        A box with the theme's "card" look: background, border, rounded corners,
        padding, scrollbars when content overflows.

    - name: Label
      md: 'Text: one line or wrapped; with `markup: true`, in several styles.'
      props:
        - {name: text, ts: string, readable: true, md: '*Readable*. May contain `\n` and `ui.symbols`. With `markup`, it is markup (below), and reads back as it was set.'}
        - name: overflow
          ts: '"wrap" | "clip" | "dots" | "scroll" | "scroll-circular"'
          md: 'What happens when text is wider than the label (set a `width` for this to matter). With `markup`: `"wrap"`, `"clip"` (the first line) or `"dots"` (set a `maxHeight` too).'
        - name: markup
          ts: boolean
          readable: true
          md: '*Readable*. Set when the Label is created (`new ui.Label({ markup: true, text })`; changing it later throws). Then `text` is Pango-style markup: `<b>` and `<i>` (bold, italic, and both: at every size, drawn from outlines when first used), `<tt>` (the monospaced font, at the size or the next smaller), `<big>` and `<small>` (a step in `ui.fonts`), `<u>`, `<s>`, `<span>` with `color` (`"#RRGGBB"` or `"#RGB"`), `size` (one of `ui.fonts`), `font_family="monospace"`, `weight="bold"`, `style="italic"`, `underline="single"`, `strikethrough="true"`; entities `&lt; &gt; &amp; &quot; &apos; &#N; &#xN;`. Anything else throws a `TypeError` that says what and at which character: an unknown tag, bold or italic monospaced text (there is no such font), `bgcolor`, tags left open or crossed, a bad value, a `&` that starts no entity. Escape data with `ui.escapeMarkup`, or build the text with `gk:i18n`''s `tm()`. [Markup](APPS.md#markup).'

    - name: Button
      md: 'A button: clicked with the mouse, or Enter or Space while focused.'
      props:
        - {name: text, ts: string, readable: true, md: '*Readable*. Creates a centered label inside the button.'}
      after_md: Buttons can also contain arbitrary children (give them a `layout`).

    - name: TextArea
      md: 'A text field, one line or several.'
      props:
        - {name: text, ts: string, readable: true, md: '*Readable*.'}
        - {name: placeholder, ts: string, md: Shown while empty.}
        - {name: oneLine, ts: boolean, md: 'Single line; Enter fires `submit`.'}
        - {name: password, ts: boolean, md: Show bullets instead of characters.}
        - {name: maxLength, ts: number, md: 0 = unlimited.}
        - {name: accept, ts: string | null, value: string or `null`, md: Only these characters can be typed.}

    - name: Checkbox
      md: 'A box to tick, with a label.'
      props:
        - {name: text, ts: string, readable: true, md: '*Readable*. Label next to the box.'}
        - {name: checked, ts: boolean, readable: true, md: '*Readable*.'}

    - name: Switch
      md: 'An on/off switch.'
      props:
        - {name: checked, ts: boolean, readable: true, md: '*Readable*.'}

    - name: Dropdown
      md: 'Picks one of several options from a list that opens.'
      props:
        - {name: options, ts: 'string[]', md: ''}
        - {name: selected, ts: number, readable: true, md: '*Readable*. Index of the selected option.'}

    - name: Slider
      md: 'A Slider sets a number in a range; a Bar shows one.'
      title: Slider, Bar
      props:
        - {name: min, also: max, ts: number, readable: true, md: '*Readable*. Integer range (default 0..100).'}
        - {name: max, ts: number, readable: true, hidden_in_table: true}
        - {name: value, ts: number, readable: true, md: '*Readable*. Clamped to the range.'}
      after_md: |
        A Slider can be changed by the person (arrow keys when focused); a Bar only
        displays a value.
    - name: Bar
      same_as: Slider

    - name: Table
      md: 'Rows and columns of text: at most 10,000 rows, 100 columns and 100,000 cells (more throws a `RangeError`).'
      props:
        - {name: data, ts: 'string[][]', md: Replaces all cells; rows may have different lengths.}
        - {name: rows, also: cols, ts: number, readable: true, md: '*Readable*.'}
        - {name: cols, ts: number, readable: true, hidden_in_table: true}
      methods:
        - {name: setCell, signature: 'setCell(row, col, text)', ts: '(row: number, col: number, text: string) => void', md: 'Grows the table if needed (within its limits).'}
        - {name: getCell, signature: 'getCell(row, col)', returns: string, ts: '(row: number, col: number) => string | undefined', md: '`undefined` outside the table.'}
        - {name: setColumnWidth, signature: 'setColumnWidth(col, px)', ts: '(col: number, px: number) => void', md: ''}

    - name: QRCode
      md: 'A QR code, drawn from text or bytes.'
      props:
        - name: data
          ts: string | Uint8Array
          value: string or `Uint8Array`
          md: "Encoded content. Text uses the most compact single mode (numeric for digits only, alphanumeric for `0-9 A-Z $%*+-./:` and space, otherwise byte mode with UTF-8); a `Uint8Array` is encoded as raw bytes. Throws `RangeError` if it doesn't fit."
        - {name: ecc, ts: '"L" | "M" | "Q" | "H"', md: 'Error correction level (default `"M"`). Never raised automatically, so the symbol is exactly what was asked for.'}
        - {name: version, ts: number, md: 'The smallest version to use, 1 to 40 (default 1): a larger one is used only if the data needs it. For a series of codes shown in turn, such as BBQr''s, which should all be one version. `modules` gives the version used: (modules - 17) / 4.'}
        - {name: size, ts: number, md: 'Side length in px (default 160), including a 4-module quiet zone. Modules are drawn at an integer scale.'}
        - {name: dark, also: light, ts: Color, value: color, md: Module colors (default black on white).}
        - {name: light, ts: Color, hidden_in_table: true}
        - {name: modules, ts: number, readonly: true, md: '*Read-only*. Modules per side of the current symbol (21 for version 1, +4 per version), 0 when empty.'}
      after_md: |
        A rejected value (data too long, size too small) throws and leaves the code
        unchanged. For example, a 24-word SeedQR (96 digits at `ecc: "L"`) is 29×29,
        a Compact SeedQR (32 bytes at `"L"`) is 25×25.

    - name: Image
      md: A picture from pixels the app supplies (GapKeep decodes no image formats).
      props:
        - name: src
          ts: ImageSource
          value: '`{ width, height, data }`'
          md: '`data`: a `Uint8Array` or `ArrayBuffer` of `width * height * 4` bytes, RGBA with straight alpha, rows top to bottom (as canvas `ImageData`). Up to 1024 px a side. Copied: the app may reuse its buffer. `sys.app.image` and the `image` of `apps.list()` entries are in this form.'
      after_md: |
        The image shows at its own size. Give the widget a `width` and `height` to
        scale it to fit (keeping its aspect ratio); `radius` rounds its corners.

        ```js
        new ui.Image({ src: sys.app.image, radius: 12 });
        ```

    - name: Scanner
      md: |
        The camera's view, and what the kernel recognises in it: the detectors
        in `detect`. The app gets what was found (a QR code's contents), never
        the picture: the kernel draws the view and runs the detectors. Needs
        `"permissions": ["camera"]` in the manifest (otherwise the constructor
        throws). See [CAMERA.md](CAMERA.md).
      props:
        - name: detect
          ts: 'Detector[]'
          readable: true
          value: 'list of detector names'
          md: '*Readable*. Required. What to look for: `"qr"` (QR codes); `"qr-color"` (experimental: a colour QR code''s colour layer, only with `experimental = yes` in the card''s `gapkeep.txt`, otherwise an unknown name). An unknown name throws, listing those this system has. More detectors (e.g. ArUco markers) will come under new names, each with its own `"detect"` event fields. May be changed while scanning.'
        - name: field
          ts: '"center" | "full"'
          readable: true
          md: '*Readable*. What part of the camera''s view the scanner sees. `"center"` (the default): the middle, at full detail: about a 26° view on the Pi camera, best for a code at 30-60 cm or a phone at arm''s length. `"full"`: all of the camera''s view, with less detail per degree, so codes must be larger in the picture. Changing it restarts a running scanner.'
        - {name: scanning, ts: boolean, readonly: true, md: '*Read-only*. Whether the camera is on for this scanner.'}
      methods:
        - {name: start, signature: start(), ts: '() => void', md: 'Turns the camera on again after `stop()` or an error. Scanning starts by itself when the widget is created.'}
        - {name: stop, signature: stop(), ts: '() => void', md: 'Turns the camera off. Deleting the widget, or the app ending, does too.'}
      events:
        - name: detect
          prop: onDetect
          ev_ts: '{ type: "detect"; target: Scanner; kind: "qr"; bytes: Uint8Array; text: string | null } | { type: "detect"; target: Scanner; kind: "qr-color"; bytes: Uint8Array; text: string | null; status: "ok" | "plain" | "unreadable"; colour: Uint8Array | null }'
          md: 'Something was found; `kind` says what. `"qr"`: `bytes` (a `Uint8Array`) is the code''s content, the bytes of its segments as encoded, without character set conversion: ECI designators are dropped (not applied), and Kanji-mode segments arrive as Shift JIS bytes; `text` the same as a string if it is valid UTF-8, else `null`; fired again only when the content changes, or when the same code comes back after 2 s out of sight, so each part of an animated code arrives once. `"qr-color"` (experimental): the same code''s colour layer, in an event of its own: `bytes` and `text` as for `"qr"`, `status` `"ok"` with the colours'' data in `colour`, or, after a second of trying, `"plain"` (no colour layer) or `"unreadable"`, with `colour` `null`; a later `"ok"` for the same code may still follow. With both detectors, a code gives a `"qr"` event and a `"qr-color"` one.'
        - name: error
          prop: onError
          ev_ts: '{ type: "error"; target: Scanner; reason: string }'
          md: 'The camera could not start or stopped working; `reason` says why (`"no camera"`, `"the camera is in use by another scanner"`, ...). Scanning has stopped; `start()` tries again.'
      after_md: |
        The view is 320×240 unless you set `width` and `height`; the picture
        (640×480 for `"center"`) is scaled to fit, and a green outline marks what
        was just found. One scanner
        at a time can have the camera.

        ```js
        new ui.Scanner({
          detect: ["qr"],
          onDetect: ({ kind, bytes, text }) => console.log(`${kind}: ${bytes.length} bytes`),
          onError: ({ reason }) => (status.text = reason),
        });
        ```

    - name: TabView
      md: 'Tabs along the top, each with its own page.'
      props:
        - {name: active, ts: number, readable: true, md: '*Readable*. Index of the shown tab.'}
      methods:
        - {name: addTab, signature: addTab(title), returns: Container, ts: '(title: string) => Container', md: "Adds a tab and returns its page. Put the tab's widgets in the page."}
      methods_first: true

  sections:
    - title: ui.alert
      md: |
        ```js
        const index = await ui.alert(message, { title, buttons });
        ```

        Shows a modal dialog over the app. `buttons` is an array of labels (default
        `["OK"]`). Resolves with the index of the button pressed, or -1 if the
        person pressed Escape. While an alert is open, Tab moves only between its
        buttons and `ui.onKey` handlers are not called. Alerts can be nested.
    - title: ui.onKey
      md: |
        ```js
        ui.onKey((ev) => { ... return true; });   // or ui.onKey(null) to remove
        ```

        Called for every key press before it reaches the focused widget. Return
        `true` to consume the key. The event has:

        | Field | Description |
        | --- | --- |
        | `key` | Key name (see below). |
        | `shift`, `ctrl`, `alt` | Modifier state (booleans). |
        | `repeat` | `true` if the key is being held down and this press is an auto-repeat (after 400 ms, every 80 ms). |

        With Ctrl or Alt held, keys are delivered to the handler only, not typed.

        #### Key names

        Printable characters are themselves (`"a"`, `"A"`, `"7"`, `" "`, `"ç"`), as
        the keyboard layout types them (`keyboard` in `gapkeep.txt`: `us` or
        `br-abnt2`); an accent typed with a dead key arrives once, composed with
        the letter (`"á"`). Others:
        `"Enter"`, `"Escape"`, `"Backspace"`, `"Delete"`, `"Tab"` (check `shift`
        for Shift+Tab), `"ArrowUp"`, `"ArrowDown"`, `"ArrowLeft"`, `"ArrowRight"`,
        `"Home"`, `"End"`, `"PageUp"`, `"PageDown"`, `"Insert"`, `"F1"`...`"F9"`.

        The Windows/Super key is reserved: it always returns to the launcher.
        Shift+PageUp and Shift+PageDown are the system's too: they scroll the
        focused widget's nearest scrollable ancestor by a page, as the mouse
        wheel scrolls what is under the pointer, and never reach `ui.onKey`.
    - title: ui.theme
      md: |
        ```js
        ui.theme({ dark: true, primary: "#009688", secondary: "#ffc107" });
        ```

        Changes the theme for widgets created afterwards; call it before building
        the screen. The secondary color is also the focus ring. The system theme is
        restored when the app exits.
    - title: Symbols
      symbols: true
      md: |
        Icon glyphs from the built-in font, usable inside any text:
        {symbols}.

        Names with dashes need bracket syntax: `ui.symbols["eye-open"]`. The same
        names are valid for `icon` in `manifest.json`.

  symbols: [audio, video, list, ok, close, power, settings, home, download, drive, refresh,
            mute, volume-mid, volume-max, image, tint, prev, play, pause, stop, next, eject,
            left, right, plus, minus, eye-open, eye-close, warning, shuffle, up, down, loop,
            directory, upload, call, cut, copy, save, bars, envelope, charge, paste, bell,
            keyboard, gps, file, wifi, battery-full, battery-3, battery-2, battery-1,
            battery-empty, usb, bluetooth, trash, edit, backspace, sd-card, new-line]

  key_event_ts: '{ key: string; shift: boolean; ctrl: boolean; alt: boolean; repeat: boolean }'

# --- other modules --------------------------------------------------------------

modules:
  - name: gk:sys
    var: sys
    exports:
      - name: kernel
        ts: '{ readonly hash: string; readonly hashedBytes: number; readonly build: "production" | "sealed" | "test" | "simulator" }'
        md: 'The running system: `{ hash, hashedBytes, build }`. `hash` is the SHA-256 of `kernel.img`, whole (`hashedBytes` long): its code and constants as they are in memory, and its data as it was loaded, before the kernel changed it. A genuine kernel shows the true hash; a tampered one could show any (docs/ARCHITECTURE.md, "Security model"); `build` is `"production"`, `"sealed"` or `"test"` (`"simulator"` in the [simulator](IDE.md), where `hash` is all zeros).'
      - name: app
        ts: AppInfo
        md: 'This app''s manifest data and origin: `{ id, name, version, description, icon, image, permissions, source, hash, experimental, suite, data, usb }`. `name` and `description` are in the language (the app''s catalog, [Languages](APPS.md#languages)) as it was when the app started. `icon` is a `ui.symbols` glyph; `image` is the manifest''s picture icon as a `ui.Image` `src`, or `null`. `source` is `"builtin"` or `"sdcard"`; `hash` is the app''s SHA-256 ([App hashes](APPS.md#app-hashes)); `experimental` whether its manifest says so ([EXPERIMENTAL.md](EXPERIMENTAL.md)); `suite` the id of the [suite](APPS.md#suites) it belongs to, or `null`; `data` the manifest''s `"data"`: the [data folders](APPS.md#data-files) it may read (`[]` if none); `usb` the manifest''s `"usb"`: the USB devices it may use with [`gk:usb`](#gkusb), as `"vvvv:pppp"` (`[]` if none).'
      - name: version
        ts: '{ readonly gapkeep: string; readonly quickjs: string; readonly lvgl: string; readonly circle: string }'
        md: '`{ gapkeep, quickjs, lvgl, circle }` version strings.'
      - {name: log, signature: log(...args), ts: '(...args: any[]) => void', md: Same as `console.log`.}
      - {name: uptime, signature: uptime(), ts: '() => number', md: 'Milliseconds since boot, as a float with microsecond resolution.'}
      - {name: memory, signature: memory(), ts: '() => { used: number; limit: number; objects: number; ui: number }', md: "`{ used, limit, objects, ui }`: this app's JS heap in bytes and its object count, and the bytes LVGL holds for everything on screen (widgets, their text and styles; the system's too, not only this app's). With the pixels of `ui.Image`s, that may not pass 32 MB: creating a widget or setting a property that would throws a `RangeError`."}
      - {name: gc, signature: gc(), ts: '() => void', md: Run the garbage collector now.}
      - {name: exit, signature: exit(), ts: '() => void', md: Leave the app and return to the launcher (after the current handler returns).}

  - name: gk:crypto
    var: crypto
    exports:
      - {name: sha1, signature: sha1(data), ts: '(data: BytesLike) => Uint8Array', md: 'SHA-1, a `Uint8Array(20)`. Broken for collisions: for HMAC-SHA1 (TOTP) and protocols that require it, not to identify data.'}
      - {name: sha256, signature: sha256(data), ts: '(data: BytesLike) => Uint8Array', md: 'SHA-256 of a typed array (its bytes), an `ArrayBuffer`, or a string (as UTF-8). Returns a `Uint8Array(32)`. Synchronous.'}
      - {name: sha512, signature: sha512(data), ts: '(data: BytesLike) => Uint8Array', md: 'SHA-512, a `Uint8Array(64)`.'}
      - {name: sha224, signature: sha224(data), ts: '(data: BytesLike) => Uint8Array', md: 'SHA-224, a `Uint8Array(28)`.'}
      - {name: sha384, signature: sha384(data), ts: '(data: BytesLike) => Uint8Array', md: 'SHA-384, a `Uint8Array(48)`.'}
      - {name: createHash, signature: createHash(hash), ts: '(hash: HashName) => Hash', md: 'A hash to feed in pieces: `update(data)` (returns the hash, so calls chain), `digest()` (the result; the hash is then finished, and using it again throws a `TypeError`), `copy()` (a new hash in the same state: hash what is common once, then each copy''s own end), `destroy()` (wipes the state now, rather than when the object is collected) and `algorithm` (its name). `hash` as for `hmac`. For data too big for one array, or that arrives in parts.'}
      - {name: hmac, signature: 'hmac(hash, key, data)', ts: '(hash: HashName, key: BytesLike, data: BytesLike) => Uint8Array', md: 'HMAC (RFC 2104) of `data` under `key`, with the hash named as in WebCrypto (`"SHA-1"`, `"SHA-224"`, `"SHA-256"`, `"SHA-384"` or `"SHA-512"`): a `Uint8Array` of the hash''s size. Keys of any length (longer than a block are hashed first, as the RFC says).'}
      - {name: ripemd160, signature: ripemd160(data), ts: '(data: BytesLike) => Uint8Array', md: 'RIPEMD-160, a `Uint8Array(20)`.'}
      - {name: hash160, signature: hash160(data), ts: '(data: BytesLike) => Uint8Array', md: 'RIPEMD-160 of SHA-256 (Bitcoin''s HASH160: P2PKH and P2WPKH addresses, BIP-32 key identifiers; a fingerprint is its first 4 bytes), a `Uint8Array(20)`.'}
      - {name: pbkdf2, signature: 'pbkdf2(hash, password, salt, iterations, length)', ts: '(hash: HashName, password: BytesLike, salt: BytesLike, iterations: number, length: number) => Uint8Array', md: 'PBKDF2 (RFC 8018) with HMAC over `hash`: a `Uint8Array(length)`. `iterations` 1 to 10,000,000, `length` 1 to 1024. A BIP-39 seed is `pbkdf2("SHA-512", mnemonic, "mnemonic" + passphrase, 2048, 64)` (both NFKD-normalised first: `.normalize("NFKD")`), about 0.1 s on a Pi Zero. Blocks until done, but, like JavaScript, is stopped by the watchdog (10 s) and the Windows key: millions of iterations take minutes.'}
      - {name: isPrivateKey, signature: isPrivateKey(key), ts: '(key: Bytes) => boolean', md: 'Whether `key` is 32 bytes from 1 to n-1 (n: the curve''s order).'}
      - {name: isPublicKey, signature: isPublicKey(key), ts: '(key: Bytes) => boolean', md: 'Whether `key` is a point on the curve, SEC 1 encoded (33 or 65 bytes).'}
      - {name: publicKey, signature: 'publicKey(privateKey, compressed = true)', ts: '(privateKey: Bytes, compressed?: boolean) => Uint8Array', md: 'The public key, 33 bytes (compressed) or 65.'}
      - {name: publicKeyConvert, signature: 'publicKeyConvert(publicKey, compressed = true)', ts: '(publicKey: Bytes, compressed?: boolean) => Uint8Array', md: 'The same key, compressed or not. A `RangeError` if it isn''t on the curve.'}
      - {name: privateKeyTweakAdd, signature: 'privateKeyTweakAdd(privateKey, tweak)', ts: '(privateKey: Bytes, tweak: Bytes) => Uint8Array', md: '(privateKey + tweak) mod n: BIP-32''s private child keys. A `RangeError` if `tweak` ≥ n or the result is 0 (BIP-32: skip to the next index).'}
      - {name: publicKeyTweakAdd, signature: 'publicKeyTweakAdd(publicKey, tweak, compressed = true)', ts: '(publicKey: Bytes, tweak: Bytes, compressed?: boolean) => Uint8Array', md: 'publicKey + tweak·G: BIP-32''s public child keys (from an xpub). A `RangeError` as above.'}
      - {name: ecdsaSign, signature: 'ecdsaSign(hash, privateKey)', ts: '(hash: Bytes, privateKey: Bytes) => Uint8Array', md: 'ECDSA signature of a 32-byte hash, DER-encoded (at most 71 bytes; add the sighash byte yourself). Deterministic (RFC 6979), low S, and low R as Bitcoin Core''s (retried with extra nonce data until R is below 2²⁵⁵).'}
      - {name: ecdsaVerify, signature: 'ecdsaVerify(signature, hash, publicKey)', ts: '(signature: Bytes, hash: Bytes, publicKey: Bytes) => boolean', md: 'Checks a strict-DER signature (without the sighash byte). High-S signatures fail, as in Bitcoin''s standard rules.'}
      - {name: xOnlyPublicKey, signature: xOnlyPublicKey(privateKey), ts: '(privateKey: Bytes) => Uint8Array', md: 'The BIP-340 public key: the point''s X, 32 bytes.'}
      - {name: schnorrSign, signature: 'schnorrSign(message, privateKey, aux)', ts: '(message: Bytes, privateKey: Bytes, aux?: Bytes) => Uint8Array', md: 'BIP-340 signature (64 bytes) of a 32-byte message. `aux`: 32 bytes of auxiliary randomness; by default fresh random bytes, as BIP-340 recommends (pass zeros for a reproducible signature).'}
      - {name: schnorrVerify, signature: 'schnorrVerify(signature, message, publicKey)', ts: '(signature: Bytes, message: Bytes, publicKey: Bytes) => boolean', md: 'Checks a BIP-340 signature against an x-only public key; the message may have any length.'}
      - {name: taprootTweakPublicKey, signature: 'taprootTweakPublicKey(publicKey, tweak)', ts: '(publicKey: Bytes, tweak: Bytes) => { key: Uint8Array; parity: 0 | 1 }', md: 'Taproot''s output key Q = P + tweak·G for the x-only internal key P (BIP-341): `key` is Q''s X, `parity` its Y''s (a script path''s control block needs it). The tweak is the app''s: the `TapTweak` tagged hash of P (and the script tree''s root, if any).'}
      - {name: taprootTweakPrivateKey, signature: 'taprootTweakPrivateKey(privateKey, tweak)', ts: '(privateKey: Bytes, tweak: Bytes) => Uint8Array', md: 'The private key for that Q (BIP-341''s `taproot_tweak_seckey`: negated if its point''s Y is odd, then plus the tweak), to sign a key-path spend with `schnorrSign`.'}
      - {name: ed25519PrivateKey, signature: ed25519PrivateKey(seed), ts: '(seed: Bytes) => Ed25519PrivateKey', md: 'An Ed25519 signing key (RFC 8032) from its 32-byte private key (the seed), held natively: `publicKey` (the `Uint8Array(32)` public key), `sign(message)` and `destroy()`. `sign` returns the 64-byte signature of `message`, any length, as it is: pure Ed25519, not Ed25519ph; for OpenPGP, the message is the signature''s digest. Deterministic (the same message gives the same signature), and checked against the public key before it is returned. `destroy()` wipes the key (`publicKey` stays); `sign` then throws a `TypeError`.'}
      - {name: ed25519Verify, signature: 'ed25519Verify(signature, message, publicKey)', ts: '(signature: Bytes, message: Bytes, publicKey: Bytes) => boolean', md: 'Checks an Ed25519 signature (64 bytes) of `message` against a 32-byte public key. Refuses non-canonical encodings and S not below the group order (RFC 8032, 5.1.7); accepts small-order keys, as RFC 8032 does.'}
      - {name: rsaPrivateKey, signature: 'rsaPrivateKey({ n, e, d, p, q, u })', ts: '(key: { n: Bytes; e: Bytes; d: Bytes; p: Bytes; q: Bytes; u?: Bytes | null }) => RsaPrivateKey', md: 'An RSA signing key from its numbers, unsigned big-endian bytes (an OpenPGP MPI''s, without the bit count; leading zeros allowed): the modulus `n` (2048 to 4096 bits, else a `RangeError`), `e`, `d`, the primes `p` and `q`, and optionally `u`, which is OpenPGP''s p⁻¹ mod q (RFC 9580, 5.5.5.1; not PKCS #1''s q⁻¹ mod p). The numbers must be one key: n = pq, de ≡ 1 mod p−1 and q−1, u if given; else a `RangeError` (p and q are not tested for being prime). The CRT values are derived natively. At most 64 keys at a time: `destroy()` those done with. Returns `{ bits, publicKey: { n, e }, sign(hash, digest, options?), destroy() }`. `sign` returns a promise of the RSASSA-PKCS1-v1_5 signature (RFC 8017) of a digest made with `hash` (SHA-224 to SHA-512; SHA-1 throws a `TypeError`), as many bytes as `n`: a [long operation](#long-operations), about 90 ms with 2048 bits on a Pi Zero, 460 ms with 4096. Wrong arguments throw at once; a fault caught by the checks rejects with an `InternalError`, and `destroy()` before the signature is made rejects it with a `TypeError`. `destroy()` wipes the key; `sign` then throws a `TypeError`.'}
      - {name: rsaVerify, signature: 'rsaVerify(signature, hash, digest, publicKey)', ts: '(signature: Bytes, hash: HashName, digest: Bytes, publicKey: { n: Bytes; e: Bytes }) => boolean', md: 'Checks an RSASSA-PKCS1-v1_5 signature (RFC 8017) of a digest made with `hash` (SHA-1 too, for old signatures), under `{ n, e }`: 1024 to 4096 bits, else `false`. **Keys under 2048 bits are weak** (1024-bit RSA is within reach of a well-funded attacker): they verify for old signatures only, and the app should say so (the size is that of `n`, which the app has); they can''t be imported to sign. `signature` is exactly as long as `n`: pad an OpenPGP MPI with zeros on the left. The expected encoding is built and compared, never parsed from the signature (DigestInfo with its NULL parameters, as RFC 9580 lists it). A `RangeError` if `digest` is not the hash''s size.'}
      - {name: aesCfbEncrypt, signature: 'aesCfbEncrypt(key, iv, data)', ts: '(key: Bytes, iv: Bytes, data: Bytes) => Uint8Array', md: 'AES in CFB mode with 128-bit feedback (NIST SP 800-38A; OpenPGP''s, RFC 9580, for protected secret keys and its encrypted data): `key` 16, 24 or 32 bytes (AES-128, -192, -256), `iv` 16 bytes, `data` any length up to 16 MiB, no padding. Returns as many bytes. To go on in another call, cut on whole blocks and pass the last 16 bytes of ciphertext as the next `iv`. Not authenticated: what it decrypts may have been changed.'}
      - {name: aesCfbDecrypt, signature: 'aesCfbDecrypt(key, iv, data)', ts: '(key: Bytes, iv: Bytes, data: Bytes) => Uint8Array', md: 'The other way, as `aesCfbEncrypt`.'}
      - {name: openpgpS2k, signature: 'openpgpS2k(type, hash, passphrase, salt, count, length, options?)', ts: '(type: 0 | 1 | 3, hash: HashName, passphrase: BytesLike, salt: Bytes | null, count: number | null, length: number, options?: JobOptions) => Promise<Uint8Array>', md: 'OpenPGP''s string-to-key (RFC 9580, 3.7.1): a promise of the `length`-byte key (1 to 64) a passphrase (at most 64 KiB) gives. `type` 0 (simple: `salt` and `count` `null`), 1 (salted: `salt` 8 bytes, `count` `null`) or 3 (iterated and salted: `salt`, and `count` the coded count octet as the packet has it, 0 to 255, which hashes (16 + (c & 15)) << ((c >> 4) + 6) bytes: 1024 to 65,011,712). A key longer than the hash runs more hashes, preloaded with zeros, as the RFC says. Not PBKDF2. A [long operation](#long-operations), every type (one API): on a Pi Zero, the largest count takes 3.8 s with SHA-256 and 3.6 s with SHA-1 (what GnuPG exports keys with), twice that when the key is longer than the hash (AES-256 from SHA-1). The passphrase is copied when the call is made. Wrong arguments throw at once.'}
      - {name: randomBytes, signature: randomBytes(n), ts: '(n: number) => Uint8Array', md: '`Uint8Array(n)` of random bytes, `n` ≤ 65536.'}
      - {name: getRandomValues, signature: getRandomValues(array), ts: '<T extends ArrayBufferView>(array: T) => T', md: "Fills a typed array in place and returns it, like WebCrypto's. ≤ 65536 bytes."}
      - {name: rngStatus, signature: rngStatus(), ts: '() => { healthy: boolean; failure: string | null; rawBytes: number }', md: '`{ healthy, failure, rawBytes }`.'}
    after_md: |
      The hashes' `data`, and `hmac`'s and `pbkdf2`'s `key`, `password` and
      `salt`, are typed arrays (their bytes: a `subarray` hashes just its
      part), `ArrayBuffer`s, or strings, taken as UTF-8. Hashes, HMAC, PBKDF2
      and OpenPGP's S2K run in the kernel (src/crypto, written from FIPS 180-4,
      the RIPEMD-160 paper, RFC 2104, RFC 8018 and RFC 9580, checked against
      their test vectors): microseconds per block on a Pi Zero, where the same
      in JavaScript takes about a millisecond. The copies made of keys and data
      are overwritten after use.

      **secp256k1** (Bitcoin's curve) is Bitcoin Core's
      [libsecp256k1](https://github.com/bitcoin-core/secp256k1) (MIT), whose
      arithmetic on secrets is constant-time. Its keys, hashes, tweaks and
      signatures are typed arrays or `ArrayBuffer`s, never strings: 32 bytes for
      private keys, hashes, messages to sign and tweaks; public keys SEC 1
      encoded (33 bytes compressed, 65 not) or, for BIP-340 and Taproot, x-only
      (32). Wrong types throw a `TypeError`, wrong sizes and keys that aren't
      keys a `RangeError`; the `verify` and `is` functions return `false`
      instead. BIP-32, addresses and transactions are the app's, in JavaScript
      on these: e.g. a child key is `privateKeyTweakAdd(k, I.slice(0, 32))` with
      `I = hmac("SHA-512", chainCode, data)`. On a Pi Zero, an ECDSA signature
      takes about 9 ms, a BIP-32 derivation step under 2 ms, a BIP-39 seed 93 ms.

      **OpenPGP's primitives**: what an OpenPGP app needs natively to make
      signatures with imported Ed25519 and RSA keys and to unlock protected
      secret keys; packets, armor, keyrings and the signed data's digest are
      the app's, in JavaScript. Ed25519 is
      [Monocypher](https://monocypher.org)'s (4.0.3, CC0 or BSD-2-Clause,
      constant-time); RSA and AES are [Mbed TLS](https://www.trustedfirmware.org/projects/mbed-tls/)'s
      (3.6 LTS, Apache-2.0: its constant-time bignum, with the private
      operation blinded and its result checked). Keys, digests, signatures,
      salts and IVs are typed arrays or `ArrayBuffer`s, never strings (a
      passphrase may be one, as UTF-8). Wrong types throw a `TypeError`,
      wrong sizes and numbers that aren't keys a `RangeError`, unknown hash
      names a `TypeError`; the `verify` functions return `false` for
      signatures and public keys that don't check out.

      Private keys are objects (`Ed25519PrivateKey`, `RsaPrivateKey`) that
      keep the key in native memory, out of reach of JavaScript, until
      `destroy()` wipes it; else it is wiped when the object is collected,
      and at the latest when the app exits. **The key's bytes do pass through
      JavaScript once**, to make the object (the app decrypts and parses its
      secret-key packet itself): overwrite those arrays (`.fill(0)`) once the
      key is made. Copies JavaScript made on the way (a `slice`, a string)
      stay in memory until the collector frees them (the heap is wiped as it
      frees), so handle key material in as few arrays as you can.

      Signing checks its own result: an RSA signature against the public key
      (twice: Mbed TLS, then GapKeep), an Ed25519 one by verifying it. A
      wrong result, which a hardware fault could cause and which could reveal
      the key, is never returned: `sign` throws an `InternalError`.

      AES runs from lookup tables, which is not constant-time against code
      sharing the processor's cache; on GapKeep, one app runs at a time, and
      the key is the app's. On a Pi Zero: an Ed25519 signature takes about
      4 ms, its verification 3 ms; an RSA signature 90 ms with 2048 bits, 220
      ms with 3072 and 460 ms with 4096 (checks included; the first with a
      key up to 170 ms more, as its blinding values are made), a
      verification under 20 ms; importing an RSA key 30 to 90 ms; AES-CFB about 10 MB/s,
      SHA-256 16 MB/s.

      <a id="long-operations"></a>**Long operations.** What can take more
      than a quarter of a second on a Pi Zero returns a promise:
      `openpgpS2k` and an RSA key's `sign`. The work is done natively in
      slices of about 20 ms, one each time round the main loop, between the
      screen being drawn and keys being read: the app stays responsive (it
      can show a progress bar, from `onProgress`; the longest wait between
      screen updates was 30 ms during the largest S2K and 220 ms
      during an RSA-4096 signature, whose two halves are one slice each).
      They run one at a time, in the order they were asked for; at most 16
      may wait (a 17th throws a `RangeError`). Arguments are checked when the
      call is made (errors are thrown, not rejected). When the app stops (it
      exits, or the Windows key takes the person home) its operations are
      dropped and wiped, their promises never settled; when the watchdog
      stops one of its scripts, they are rejected with an `InternalError`.
      The last argument may be `{ onProgress }`: a function called after each
      slice that moved the work on, with a fraction (more than 0, at most 1).
      `pbkdf2` stays synchronous (like the hashes, Ed25519, verification, AES
      and importing keys, which are fast at the sizes apps use).

      Each group (RIPEMD-160, PBKDF2, secp256k1, Ed25519, RSA, AES, S2K)
      checks itself against known answers before its first use; if that
      fails, it throws an `InternalError` until reboot.

      **Where the randomness comes from.** The BCM2835's hardware random number
      generator, treated as a noise source of unknown quality. Every raw byte
      passes NIST SP 800-90B's continuous health tests (Repetition Count and
      Adaptive Proportion, tuned for an assumed 1 bit of entropy per byte), 4096
      bytes are tested at boot, and each 32 output bytes are SHA-256 of 256 raw
      bytes. If a test ever fails, the generator shuts off until reboot:
      `randomBytes` and `getRandomValues` then throw an `InternalError`, and never
      return weak bytes.

      The hardware RNG is undocumented. Apps handling secrets should treat it as a
      supplement to entropy the person provides (dice, coins), not a replacement.
      (In the [simulator](IDE.md), the bytes come from the host's random source.)

      To run code written for WebCrypto unchanged, give it a small adapter:

      ```js
      import * as gkcrypto from "gk:crypto";
      globalThis.crypto = {
        getRandomValues: gkcrypto.getRandomValues,
        subtle: { digest: async (alg, data) => ({ "SHA-1": gkcrypto.sha1, "SHA-256": gkcrypto.sha256,
                                                   "SHA-384": gkcrypto.sha384,
                                                   "SHA-512": gkcrypto.sha512 })[alg](data).buffer },
      };
      ```

  - name: gk:clock
    var: clock
    intro_md: |
      ```js
      import * as clock from "gk:clock";
      ```

      The wall clock, kept by the system whatever app runs. A Pi Zero has no
      battery-backed clock, so the time is lost at power-off: until the clock
      app sets it, it counts from 1970-01-01 at boot (`status().set` is
      `false`). `Date.now()` and `new Date()` follow this clock, and local
      time (`getHours()`, ...) is UTC plus the clock's fixed offset (no daylight
      saving rules). Every app may read it; setting it needs
      `"permissions": ["rtc"]` (the others throw a `TypeError`). See
      [CLOCK.md](CLOCK.md).
    exports:
      - {name: now, signature: now(), ts: '() => number', md: 'Milliseconds since 1970-01-01 UTC: the same as `Date.now()`.'}
      - name: status
        signature: status()
        ts: '() => ClockStatus'
        md: '`{ set, time, trimPpm, utcOffset, drift }`: whether the time was set since boot; the time (ms, as `now()`); the trim correcting the crystal, in parts per million (+ runs faster); local time''s offset from UTC in minutes (-180 for UTC-03:00); and `drift`, `null` or what the last `set()` measured: `{ correction, over, trimPpm, uncertaintyPpm }`: the clock was `correction` seconds off (+: fast) after `over` seconds, so `trimPpm` would have kept it right, give or take `uncertaintyPpm` (half a second''s error in each setting). Measured only when the sets are at least an hour apart.'
      - {name: set, signature: set(time), ts: '(time: number | Date) => ClockStatus', md: '*Needs "rtc".* Sets the time (ms since 1970, or a `Date`; from 2000 to 2099) and returns `status()`, with the drift measured since the last `set()`.'}
      - {name: setTrim, signature: setTrim(ppm), ts: '(ppm: number) => void', md: '*Needs "rtc".* The trim, -500 to 500 ppm. Takes effect from now, without changing the time. At boot it comes from `clock_trim_ppm` in the card''s `gapkeep.txt`.'}
      - {name: setUtcOffset, signature: setUtcOffset(minutes), ts: '(minutes: number) => void', md: '*Needs "rtc".* Local time''s offset, -720 to 840 minutes (UTC-12:00 to UTC+14:00). At boot it comes from `utc_offset` in `gapkeep.txt`.'}
      - {name: every, signature: 'every(seconds, fn)', ts: '(seconds: number, fn: (ev: { time: number; changed: boolean }) => void) => number', md: 'Calls `fn` on the clock''s marks: whenever the UTC time is a multiple of `seconds` (whole, 1 to 86400), e.g. at :00 and :30 for 30, and at once (`changed: true`) whenever the clock is set or its trim or offset change. `fn` gets `{ time, changed }`. Returns an id for `cancel`. Ends with the app.'}
      - {name: cancel, signature: cancel(id), ts: '(id: number) => void', md: 'Stops an `every`.'}

  - name: gk:session
    var: session
    intro_md: |
      ```js
      import * as session from "gk:session";
      ```

      Values an app keeps across its runs: leave it, use other apps, come back,
      and they are still there. **Only until the device is switched off**: the
      store is in the kernel's RAM, and nothing is ever written to the card. Each
      app has its own, which no other app can read, and neither can another
      version of the app: the store is filed under the app's id and its
      [hash](APPS.md). Up to 64 KiB per app (keys and values), 1 MiB for all.

      ```js
      const accounts = session.get("accounts") ?? [];
      // ... the person adds one ...
      session.set("accounts", accounts);
      ```

      Values are copied in and out, as a structured clone: objects, arrays,
      strings, numbers, booleans, `null`, BigInts, `Date`s, `ArrayBuffer`s and
      typed arrays. Changing a value after `set` doesn't change what is stored:
      `set` it again. Not stored (a `TypeError`, and the store is left as it
      was): functions, `Map`, `Set`, getters, cycles. Objects come back as
      plain objects (not their class). A typed array is stored with its whole
      buffer: store `a.slice()` rather than a view into a larger buffer.

      What is removed, replaced or cleared is overwritten in memory before it is
      freed. Secrets kept here are still in RAM until power-off: give the person
      a way to forget them (`clear()`).
    exports:
      - {name: set, signature: 'set(key, value)', ts: '(key: string, value: SessionValue | undefined) => void', md: 'Stores a copy of `value` under `key` (1 to 64 bytes of UTF-8), replacing what was there; `undefined` removes the key. A `RangeError` if the app''s values would take over 64 KiB (or the store is full), and nothing changes.'}
      - {name: get, signature: get(key), ts: '(key: string) => SessionValue | undefined', md: 'A fresh copy of the value, or `undefined`.'}
      - {name: remove, signature: remove(key), ts: '(key: string) => boolean', md: 'Removes the key; `false` if it wasn''t there.'}
      - {name: keys, signature: keys(), ts: '() => string[]', md: 'The app''s keys, in the order they were first set.'}
      - {name: clear, signature: clear(), ts: '() => void', md: 'Removes all of the app''s values.'}
      - {name: usage, signature: usage(), ts: '() => { used: number; limit: number }', md: 'Bytes the app''s keys and values take, and its limit (65536).'}

  - name: gk:i18n
    var: i18n
    intro_md: |
      ```js
      import { t, plural } from "gk:i18n";

      new ui.Label({ text: t("Sign this transaction?") });
      ui.alert(t("Signed {n} of {total} inputs.", { n, total }));
      label.text = plural(count, "{n} code", "{n} codes");
      ```

      The app's text in the person's language. The English text is the key,
      written where it is used; the translations are the app's catalogs,
      `lang/<language>.json`, loaded and checked when the app starts (see
      [Languages](APPS.md#languages)). A key without a translation shows in
      English. Numbers, amounts and dates are written the same way on every
      build (QuickJS has no `Intl`).

      The language, the number marks and the keyboard layout come from
      `gapkeep.txt` at boot (`language = pt-BR`, `decimal_mark`, `group_mark`)
      and can be changed until power-off by an app with
      `"permissions": ["settings"]` (the Settings app); without it the setters
      throw a `TypeError`. A new language applies to the apps started after
      the change, and at once to the app that made it, through
      `onLanguageChange`.
    exports:
      - {name: t, signature: 't(text, params?)', ts: '(text: string, params?: { [name: string]: string | number | boolean; $context?: string }) => string', md: 'The translation of `text`, or `text` itself. `{name}` is replaced by `params.name`: numbers as `formatNumber` writes them, other values as strings; a BigInt throws a `TypeError` (format amounts first). A `{name}` not in `params` stays as written; `{{` and `}}` are braces. `$context` tells apart the same English in two meanings: `t("Open", { $context: "verb" })` is the catalog key `"verb\u0004Open"`. Keys should be string literals, so `tools/i18n.py` finds them.'}
      - {name: tm, signature: 'tm(text, params?)', ts: '(text: string, params?: { [name: string]: string | number | boolean; $context?: string }) => string', md: 'As `t`, for a Label with `markup: true`: every param is escaped (`ui.escapeMarkup`), so a name, an address or a scanned text never becomes a tag. If `text` has a tag or an entity it is markup (its translation keeps the same tags: checked on load), else plain text, escaped too.'}
      - {name: plural, signature: 'plural(n, one, other, params?)', ts: '(n: number, one: string, other: string, params?: { [name: string]: string | number | boolean; $context?: string }) => string', md: '`t(one)` or `t(other)` by the language''s plural rule (English and Portuguese: one for 1, other otherwise, 0 too), with `n` added to `params`.'}
      - {name: language, signature: language(), ts: '() => string', md: 'The language, a BCP 47 tag: `"en"`, `"pt-BR"`, or `"qps"` (a pseudo-language for testing: every translated text accented, about 40% longer and in brackets).'}
      - {name: languages, signature: languages(), ts: '() => { tag: string; name: string }[]', md: 'The languages the system has (English and those the launcher has a catalog for), each named in itself: `[{ tag: "en", name: "English" }, { tag: "pt-BR", name: "Português (Brasil)" }]`.'}
      - {name: setLanguage, signature: setLanguage(tag), ts: '(tag: string) => void', md: '*Needs "settings".* Changes the language until power-off. This app''s catalog is loaded again at once and its `onLanguageChange` handlers run; other apps get it when they start. A `RangeError` for a language not in `languages()` (or `"qps"`).'}
      - {name: onLanguageChange, signature: onLanguageChange(fn), ts: '(fn: (ev: { language: string; marks: { decimal: string; group: string } }) => void) => () => void', md: 'Calls `fn` after the language or the marks change, to redraw. Returns a function that removes it.'}
      - {name: marks, signature: marks(), ts: '() => { decimal: string; group: string }', md: 'The marks numbers are written with: `{ decimal: ".", group: "," }` in English, `{ decimal: ",", group: "." }` in Portuguese, unless set otherwise. `group` may be `""` (no grouping). For apps that draw numbers themselves.'}
      - {name: setMarks, signature: setMarks(marks), ts: '(marks: { decimal?: "." | ","; group?: "." | "," | "" } | null) => void', md: '*Needs "settings".* The marks, until power-off; `null` or a mark left out: the language''s own. If only one is given and the language''s other mark is the same, the other is the other one (`{ decimal: "," }` in English: 1.234,5). A `RangeError` if both are given and the same.'}
      - {name: keyboard, signature: keyboard(), ts: '() => string', md: 'The keyboard layout: `"us"` or `"br-abnt2"` (`keyboard` in `gapkeep.txt`).'}
      - {name: keyboards, signature: keyboards(), ts: '() => string[]', md: 'The layouts there are: `["us", "br-abnt2"]`.'}
      - {name: setKeyboard, signature: setKeyboard(layout), ts: '(layout: string) => void', md: '*Needs "settings".* The layout, from `keyboards()`, at once for every app, until power-off. A dead key pending is dropped. `RangeError` for a layout not in `keyboards()`.'}
      - {name: formatNumber, signature: 'formatNumber(x, { decimals }?)', ts: '(x: number | bigint, options?: { decimals?: number }) => string', md: 'Thousands grouped, the language''s decimal mark: `1,234,567.5` or `1.234.567,5`. `decimals` (0 to 20): exactly that many, rounded; otherwise as many as the number has. Never an exponent.'}
      - {name: formatSats, signature: formatSats(sats), ts: '(sats: number | bigint) => string', md: 'Whole satoshis, grouped: `2,100,000`. A safe integer or a BigInt, else a `TypeError`.'}
      - {name: formatBtc, signature: 'formatBtc(sats, { decimals = 8 }?)', ts: '(sats: number | bigint, options?: { decimals?: number }) => string', md: 'Satoshis as BTC, never through floating point: `1.23456789`, `20.999.999,97690000`. `decimals` (0 to 8) is the least shown: trailing zeros beyond it are left out, other digits never are (`formatBtc(120000000, { decimals: 0 })` is `1.2`). No unit: write `"{amount} BTC"` in the text, so a translation can move it.'}
      - {name: parseNumber, signature: parseNumber(text), ts: '(text: string) => number', md: 'A number as typed, with a sign if any. What could be read two ways is refused (`"1.000"` in Portuguese, `"1,000"` in English: one or a thousand?); a lone mark that can''t be a thousands separator (`0.001`, `1,5`) is the decimal mark in any language; several marks must be the language''s thousands, properly grouped. Refusals are a `RangeError` whose message, translated, says what to type.'}
      - {name: parseBtc, signature: parseBtc(text), ts: '(text: string) => number', md: 'An amount in BTC as typed, in whole satoshis (a Number: 21 million BTC fit exactly), with the rules of `parseNumber`; no sign, at most 8 decimals, at most 21,000,000 BTC.'}
      - {name: formatDateTime, signature: 'formatDateTime(seconds, { utc }?)', ts: '(seconds: number, options?: { utc?: boolean }) => string', md: 'ISO 8601 with a space, in every language: `2026-11-08 14:03:05`, in the clock''s local time ([`gk:clock`](#gkclock)''s UTC offset); with `{ utc: true }`, in UTC and followed by ` UTC`. `seconds` since 1970; fractions are dropped.'}
      - {name: formatDate, signature: 'formatDate(seconds, { utc }?)', ts: '(seconds: number, options?: { utc?: boolean }) => string', md: '`2026-11-08`, as `formatDateTime`.'}
      - {name: formatTime, signature: 'formatTime(seconds, { utc }?)', ts: '(seconds: number, options?: { utc?: boolean }) => string', md: '`14:03:05`, as `formatDateTime`.'}

  - name: gk:data
    var: data
    intro_md: |
      ```js
      import * as data from "gk:data";
      ```

      Read-only files the person put on the SD card when preparing it, in
      `data/<folder>/...` beside `apps/`: public keys, address books, word
      lists. An app reads only the folders its manifest lists, `"data": ["pgp"]`,
      and nothing can write them. Apps that list the same folder share it.
      Any kind of file: binary (an exported OpenPGP key) or text (`.asc`).
      [APPS.md, "Data files"](APPS.md#data-files) says how to lay them out and
      put them on a card, or build them into a sealed kernel.

      ```js
      for (const { name, size } of data.list("pgp")) {
        const key = data.read("pgp", name);          // Uint8Array
        // ... parse it, show its fingerprint ...
      }
      ```

      **The data is not part of the app's [hash](APPS.md#app-hashes).** The app
      hash names the code, and is the same on every card; the data is whatever
      the card holds, and whoever can change the card can change it. So show
      the person what matters before using it: for a key, its fingerprint,
      to be compared with one they trust; `hash(folder)` names the whole
      folder, as the launcher shows it.

      Every folder some installed app lists is read at boot, all of it,
      hashed, and kept in memory until power-off; these functions never
      touch the card, which can be taken out once the launcher is up. What
      the app reads is what was hashed. Limits: 4 MB per file, 8 MB and 256
      files per folder, 32 folders and 32 MB in all. A folder over them, or
      with a name that is not printable ASCII, is refused at boot: every call
      on it throws, saying why. Names starting with `.` (macOS's `._x`) are
      skipped. A sealed build reads no card; its data folders, if any, are
      built into the kernel and served the same way.

      Every refusal is a `TypeError` that says what is wrong: a folder that
      is not in the manifest, a path that leaves the folder (`..`, `.`, a
      leading `/`, a `\`), a file that isn't there. A folder that isn't there
      (not on the card; every folder without a card, or in a sealed build
      without built-in data) has no files: `list()` returns `[]` and
      `hash()` `null`.
    exports:
      - {name: list, signature: list(folder), ts: '(folder: string) => { name: string; size: number }[]', md: 'The folder''s files, `{ name, size }`, sorted by name (byte order): `name` is the path inside the folder, with `/` between folders (`"keys/alice.asc"`), `size` in bytes. `[]` if there is no such folder.'}
      - {name: read, signature: 'read(folder, name)', ts: '(folder: string, name: string) => Uint8Array', md: 'The file''s bytes, a fresh copy. `name` as `list()` gives it.'}
      - {name: readText, signature: 'readText(folder, name)', ts: '(folder: string, name: string) => string', md: 'The file as UTF-8 text. A `TypeError` if it isn''t valid UTF-8 (or holds a NUL byte); `read()` gives its bytes.'}
      - {name: hash, signature: hash(folder), ts: '(folder: string) => string | null', md: 'The SHA-256 of the folder''s files, 64 hex digits, as the launcher shows it: the [app hash](APPS.md#app-hashes)''s scheme, so `tools/bundle_apps.py --data-hash <folder>` computes it on a computer. `null` if there is no such folder.'}

  - name: gk:usb
    var: usb
    intro_md: |
      ```js
      import * as usb from "gk:usb";
      ```

      Control transfers to USB devices the app lists by vendor and product id
      in its manifest: `"usb": ["16c0:27db"]` (lowercase hex, at most 8).
      Importing it without them throws a `ReferenceError`. A device some
      available app lists is **claimed whole** by the system when it is
      plugged in (those plugged in at boot too): none of its interfaces gets
      a system driver, so a keyboard or mouse in it is ignored, and what it
      types never reaches the system. Every app that lists it can use it, as
      apps run one at a time. Only endpoint 0 is reached: control transfers
      of at most 64 bytes, each stage given 1 s ([ARCHITECTURE.md](ARCHITECTURE.md),
      "Security model"). After two timeouts a device's transfers fail at once,
      until it is plugged in again.

      ```js
      usb.onAttach(async (device) => {
        const board = usb.open(device);
        await board.setFeatureReport(2, request);           // HID SET_REPORT
        const answer = await board.getFeatureReport(2, 37);  // HID GET_REPORT
        board.close();
      });
      for (const device of usb.list()) { /* plugged in already */ }
      ```

      Transfers are promises: each is queued, and the system does one at a
      time, between frames, so the screen stays drawn. Arguments are checked
      at the call (a `TypeError` or `RangeError`, thrown); what the device
      does settles the promise. A rejection is an `Error` with a `code`:
      `"stall"` (the device refused the request), `"timeout"`, `"detached"`,
      `"closed"` (the handle was closed while it waited) or `"error"` (the
      bus, or a device that sent more than was asked for). At most 16 wait at
      once.

      The setup of a transfer is `{ type, recipient, request, value, index }`:
      `type` `"standard"`, `"class"` or `"vendor"`; `recipient` `"device"` or
      `"interface"` (then `index`'s low byte must be one of the device's
      interfaces); `request` 0 to 255; `value` and `index` 0 to 65535
      (default 0). Of the standard requests only those that read are an
      app's (GET_STATUS, GET_DESCRIPTOR, GET_CONFIGURATION, GET_INTERFACE,
      with `controlIn`): the others change how the system talks to the
      device.

      A handle (`open()`) has `device` (as `list()` gives it) and these
      methods:

      | Method | Does |
      | --- | --- |
      | `controlIn(setup, length)` | A control transfer reading 1 to 64 bytes. Resolves to a `Uint8Array` of what came (it may be shorter). |
      | `controlOut(setup, data?)` | A control transfer writing `data` (a `Uint8Array`, `ArrayBuffer` or array of bytes; 0 to 64). Resolves to the number of bytes sent. |
      | `getFeatureReport(id, length, iface?)` | HID GET_REPORT of feature report `id` on interface `iface` (default: the first HID interface). Resolves to the data stage as the device sent it: with report ids, most devices put the id first. |
      | `setFeatureReport(id, data, iface?)` | HID SET_REPORT: the data stage is the id (unless it is 0) followed by `data`, at most 64 bytes in all, as Linux and WebHID send it. Resolves to `undefined`. |
      | `close()` | Closes the handle; its transfers still waiting reject with `"closed"`. |

      Nothing a transfer carries is logged: the log has the request's numbers
      and length when one fails or is refused. In the simulator, devices come
      over USB/IP ([SIMULATOR.md](SIMULATOR.md#usb-devices)); the browser IDE
      has none.
    exports:
      - {name: list, signature: list(), ts: '() => UsbDevice[]', md: 'The devices plugged in that the manifest lists: `{ id, vid, pid, manufacturer, product, serial, speed, interfaces }`. `id` is new each time a device is plugged in; `manufacturer` and `product` are what the device says (`""` if nothing), with characters that could change how text reads (control, bidi, invisible) as `?`; `serial` likewise, or `null`; `speed` `"low"`, `"full"`, `"high"` or `"super"`; `interfaces` `[{ number, class, subclass, protocol }]` (alternate setting 0 of each).'}
      - {name: open, signature: open(device), ts: '(device: UsbDevice | number) => UsbHandle', md: 'A handle on a device of `list()` or of an event (or its `id`): `{ device, controlIn, controlOut, getFeatureReport, setFeatureReport, close }`, above. A `TypeError` if it is not plugged in, not listed, or open already (`close()` it first).'}
      - {name: onAttach, signature: onAttach(fn), ts: '(fn: (device: UsbDevice) => void) => () => void', md: 'Calls `fn` with each listed device plugged in while the app runs. Returns a function that removes it.'}
      - {name: onDetach, signature: onDetach(fn), ts: '(fn: (device: UsbDevice) => void) => () => void', md: 'Calls `fn` with each listed device unplugged. Its handle''s transfers fail from then on (`"detached"`); plugged in again it is a new device, with a new `id`.'}

  - name: gk:apps
    var: apps
    intro_md: |
      Requires `"permissions": ["apps"]` in the manifest; importing it otherwise
      throws a `ReferenceError`. Used by the launcher.
    exports:
      - {name: list, signature: list(), ts: '() => AppInfo[]', md: 'Array of `{ id, name, version, description, icon, image, permissions, source, hash, experimental, suite, data, usb }` (as `sys.app`) (`name` and `description` in the language: each app''s own catalog translates them) for every app not marked `hidden`, and not marked `experimental` unless the card''s `gapkeep.txt` says `experimental = yes`: the built-in apps (sorted by id; test builds list their test-only apps last), then those from the SD card (sorted by folder; a [suite](APPS.md#suites)''s apps, in `apps/<suite>/<id>`, where the suite''s folder sorts, each with `suite` set to the suite''s id).'}
      - {name: suites, signature: suites(), ts: '() => { id: string; name: string; description: string; icon: string; image: { width: number; height: number; data: Uint8Array } | null }[]', md: 'The [suites](APPS.md#suites) on the card (`apps/<id>/suite.json`), sorted by id: `{ id, name, description, icon, image }`, as for apps (`name` and `description` in the language, from the suite''s own `lang/` catalogs). A suite whose apps were all refused is listed too; the launcher shows only suites with apps.'}
      - {name: dataHash, signature: dataHash(folder), ts: '(folder: string) => string | null', md: 'The hash of the [data folder](APPS.md#data-files) `data/<folder>`, as `gk:data`''s `hash()` gives it: the launcher shows those an app lists (only those are read, at boot). `null` if there is no such folder, or no app lists it; a `TypeError` if it was refused (too big, a bad name).'}
      - {name: launch, signature: launch(id), ts: '(id: string) => void', md: 'Stop the current app and start `id` (after the current handler returns). Throws if there is no such app, or if it is experimental and experimental features are off.'}
      - name: card
        signature: card()
        ts: '() => { status: "ok" | "none" | "unreadable" | "no-apps" | "disabled"; problems: { folder: string; error: string }[] }'
        md: 'The SD card: `{ status, problems }`. `status` is `"ok"` (`/apps` was read), `"none"` (no card), `"unreadable"` (no FAT file system), `"no-apps"` (no `/apps` folder) or `"disabled"` (sealed build). `problems` lists the folders in `/apps` that were not loaded: `[{ folder, error }]`, at most 16.'

# shared types for gapkeep.d.ts
shared_ts:
  BytesLike: |
    ArrayBufferView | ArrayBuffer | string
  Bytes: |
    ArrayBufferView | ArrayBuffer
  JobOptions: |
    {
      /** called as the work goes on, with how far it is: more than 0, at most 1 */
      onProgress?: (fraction: number) => void;
    }
  HashName: |
    "SHA-1" | "SHA-224" | "SHA-256" | "SHA-384" | "SHA-512"
  Hash: |
    {
      /** "SHA-256", ... */
      readonly algorithm: HashName;
      /** adds data (strings as UTF-8); returns this hash */
      update(data: BytesLike): Hash;
      /** the digest; the hash is finished (using it again throws) */
      digest(): Uint8Array;
      /** a new hash in the same state */
      copy(): Hash;
      /** wipes the state; the hash is finished */
      destroy(): void;
    }
  Ed25519PrivateKey: |
    {
      /** 32 bytes */
      readonly publicKey: Uint8Array;
      /** the 64-byte signature of message (pure Ed25519) */
      sign(message: Bytes): Uint8Array;
      /** wipes the private key; sign() then throws */
      destroy(): void;
    }
  RsaPrivateKey: |
    {
      /** the modulus's size, 2048 to 4096 */
      readonly bits: number;
      /** n and e, big-endian, without leading zeros */
      readonly publicKey: { n: Uint8Array; e: Uint8Array };
      /** RSASSA-PKCS1-v1_5 of a digest: as many bytes as n (not SHA-1); a long operation */
      sign(hash: "SHA-224" | "SHA-256" | "SHA-384" | "SHA-512", digest: Bytes, options?: JobOptions): Promise<Uint8Array>;
      /** wipes the private key; the key can't be used again */
      destroy(): void;
    }
  SessionValue: |
    string | number | boolean | null | bigint | Date | ArrayBuffer | ArrayBufferView
      | SessionValue[] | { [key: string]: SessionValue }
  ClockStatus: |
    {
      set: boolean;
      time: number;
      trimPpm: number;
      utcOffset: number;
      drift: { correction: number; over: number; trimPpm: number; uncertaintyPpm: number } | null;
    }
  UsbDevice: |
    {
      /** new each time the device is plugged in */
      readonly id: number;
      readonly vid: number;
      readonly pid: number;
      readonly manufacturer: string;
      readonly product: string;
      readonly serial: string | null;
      readonly speed: "low" | "full" | "high" | "super";
      readonly interfaces: { number: number; class: number; subclass: number; protocol: number }[];
    }
  UsbSetup: |
    {
      type: "standard" | "class" | "vendor";
      recipient: "device" | "interface";
      request: number;
      value?: number;
      index?: number;
    }
  UsbHandle: |
    {
      readonly device: UsbDevice;
      /** reads 1 to 64 bytes; rejects with an Error whose code is "stall", "timeout", "detached", "closed" or "error" */
      controlIn(setup: UsbSetup, length: number): Promise<Uint8Array>;
      /** writes 0 to 64 bytes; resolves to the number sent */
      controlOut(setup: UsbSetup, data?: Uint8Array | ArrayBuffer | number[]): Promise<number>;
      /** HID GET_REPORT (feature) on iface, by default the first HID interface */
      getFeatureReport(id: number, length: number, iface?: number): Promise<Uint8Array>;
      /** HID SET_REPORT (feature): the id (unless 0), then data; 64 bytes in all at most */
      setFeatureReport(id: number, data: Uint8Array | ArrayBuffer | number[], iface?: number): Promise<void>;
      close(): void;
    }
  AppInfo: |
    {
      readonly id: string;
      readonly name: string;
      readonly version: string;
      readonly description: string;
      /** a ui.symbols glyph */
      readonly icon: string;
      /** the manifest's picture icon, for ui.Image's src, or null */
      readonly image: { width: number; height: number; data: Uint8Array } | null;
      readonly permissions: string[];
      readonly source: "builtin" | "sdcard";
      /** SHA-256 of the app's files (docs/APPS.md, "App hashes") */
      readonly hash: string;
      /** the manifest says "experimental" (docs/EXPERIMENTAL.md) */
      readonly experimental: boolean;
      /** the id of its suite (apps/<suite>/<id>, docs/APPS.md, "Suites"), or null */
      readonly suite: string | null;
      /** the manifest's "data": the data folders it may read with gk:data */
      readonly data: string[];
      /** the manifest's "usb": the USB devices it may use with gk:usb, "vvvv:pppp" */
      readonly usb: string[];
    }

globals:
  - {names: 'console.log`, `info`, `warn`, `error`, `debug', md: 'Write to the serial log as `app:<id>`. Strings are printed as-is, errors with their stack, other objects as JSON.'}
  - {names: 'setTimeout(fn, ms)`, `setInterval(fn, ms)', md: 'Return a numeric id. Extra arguments are not passed on; use a closure. Interval minimum 1 ms.'}
  - {names: 'clearTimeout(id)`, `clearInterval(id)', md: Unknown ids are ignored.}

globals_after: |
  Not available: `fetch`, `XMLHttpRequest`, `WebSocket`, `localStorage` (see
  [`gk:session`](#gksession)),
  `require`, `process`, the DOM, and the global `crypto` object (use
  [`gk:crypto`](#gkcrypto)).

globals_ts: |
  declare var console: {
    log(...args: any[]): void;
    info(...args: any[]): void;
    warn(...args: any[]): void;
    error(...args: any[]): void;
    debug(...args: any[]): void;
  };
  /** Returns a numeric id. Extra arguments are not passed on: use a closure. */
  declare function setTimeout(fn: () => void, ms?: number): number;
  /** Returns a numeric id. Minimum interval 1 ms. */
  declare function setInterval(fn: () => void, ms?: number): number;
  declare function clearTimeout(id: number): void;
  declare function clearInterval(id: number): void;

limits:
  - [JS heap per app, 96 MB]
  - [JS stack, 512 KB]
  - ['One handler, timer or job', '10 s, then interrupted (the app keeps running)']
  - [Display, 'Whatever the HDMI output negotiates (640×480 in QEMU and, by default, the simulator)']
